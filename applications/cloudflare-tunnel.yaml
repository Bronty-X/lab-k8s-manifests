
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://cloudflare.github.io/helm-charts
    chart: cloudflare-tunnel
    targetRevision: 0.3.2
    helm:
      values: |
        cloudflare:
          tunnelName: k8s-ingress
          secretName: cloudflare-tunnel-secret
          enableWarp: false

          ingress:
            - hostname: "*.kl.a-lp.com"
              service: http://ingress-nginx-controller.nginx-ingress.svc.cluster.local:80

        replicaCount: 2

        image:
          repository: cloudflare/cloudflared
          tag: "2026.11.2"

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
